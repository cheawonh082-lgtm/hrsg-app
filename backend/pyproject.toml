[project]
name = "hrsg-reference-backend"
version = "0.1.0"
description = "HRSG 레퍼런스 앱 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "anthropic>=1.17,<2",  # LLM_PROVIDER=claude
    "google-genai>=2.33",  # LLM_PROVIDER=gemini
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2",  # starlette TestClient 권장 클라이언트
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]

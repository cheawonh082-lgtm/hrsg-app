# Render Blueprint — 무료 플랜 2개 서비스 (DEPLOY.md 참고)
#   hrsg-reference-api : FastAPI 백엔드 (Python 웹 서비스, free — 15분 동안 요청이 없으면 잠듦)
#   hrsg-reference-web : React 프론트엔드 (정적 사이트). /api/* 는 백엔드로 넘겨(rewrite) 앱 코드는 그대로 상대 경로 /api 를 쓴다
# API 키는 여기에 쓰지 않는다 — LLM_API_KEY는 sync: false라 Blueprint를 처음 만들 때 Render 화면에서 입력한다.
services:
  - type: web
    name: hrsg-reference-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: CALC_ENGINE
        value: mock
      - key: DATA_SOURCE
        value: mock
      - key: LLM_PROVIDER
        value: claude          # 키 없이 띄우려면 fake
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: LLM_FALLBACK_MODELS   # gemini 전용 — claude에서는 쓰지 않는다
        value: ""
      # Anthropic API 키. sync: false라 Render 화면(Environment)에서 직접 넣고 바꾼다
      - key: LLM_API_KEY
        sync: false
      # 논문 검색: 무료 플랜(512MB)은 임베딩 모델을 올릴 수 없으므로 Cloudflare Worker(Workers AI bge-m3 + Vectorize)를 쓴다
      # (hrsg-explorer-rag/cloudflare/worker, 배포: scripts/cloudflare_sync.py deploy)
      - key: RAG_RETRIEVER
        value: api
      - key: RAG_API_URL
        value: https://hrsg-rag-search.auroora0802.workers.dev
      - key: RAG_API_TOP_N
        value: "5"
      - key: RAG_API_TIMEOUT_S
        value: "30"
      # Worker 비밀키(hrsg-explorer-rag/.env의 RAG_API_KEY와 같은 값). sync: false라 Render 화면에서 직접 넣는다
      - key: RAG_API_KEY
        sync: false

  - type: web
    name: hrsg-reference-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist   # rootDir(frontend) 기준
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # 백엔드 주소가 다르면(이름이 이미 쓰여 뒤에 문자가 붙은 경우) 아래 URL을 실제 주소로 바꾼다
      - type: rewrite
        source: /api/*
        destination: https://hrsg-reference-api.onrender.com/api/*
      # 새로고침·직접 접속 시 React Router 경로를 index.html로
      - type: rewrite
        source: /*
        destination: /index.html
